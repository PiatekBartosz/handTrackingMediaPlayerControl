[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hand-tracking-media-player-control"
version = "0.1.0"
description = "Sterowanie odtwarzaczem mediów gestami dłoni przy użyciu MediaPipe"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "imutils>=0.5.4",
    "mediapipe==0.10.35",
    "numpy>=1.26",
    "pillow>=10.4.0",
    "pynput>=1.8.1",
    "loguru>=0.7",
    "matplotlib>=3.8",
    # opencv-contrib-python jest automatycznie pobierane przez mediapipe 0.10.35
    # protobuf usunięto — mediapipe 0.10.x używa wewnętrznie flatbuffers
]

[tool.hatch.build.targets.wheel]
packages = ["helpers"]

[tool.hatch.build.targets.sdist]
include = [
    "helpers/",
    "server_demo.py",
    "client_demo.py",
    "model/",
    "README.md",
]
